<!doctype html><meta charset="utf-8"><title>Textos del PDF · nivel 2</title><pre id="out">Extrayendo textos…</pre>
<script type="module">
// Paso 1: extrae los textos del PDF con su posición (puntos PDF, origen arriba a la izquierda) en data/n02/textos-pdf.json.
import * as pdfjs from '/repo/dist/vendor/pdf.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = '/repo/dist/vendor/pdf.worker.mjs';
const doc = await pdfjs.getDocument({url: '/repo/dist/source/n02-planta-arquitectura.pdf', standardFontDataUrl: '/repo/dist/vendor/standard_fonts/'}).promise;
const page = await doc.getPage(1), vp = page.getViewport({scale: 1}), txt = await page.getTextContent();
const items = txt.items.filter(t => t.str.trim()).map(t => { const [x, y] = vp.convertToViewportPoint(t.transform[4], t.transform[5]); return {s: t.str, x: +x.toFixed(2), y: +y.toFixed(2), h: +Math.hypot(t.transform[2], t.transform[3]).toFixed(2), w: +t.width.toFixed(2)}; });
await fetch('/save?name=data/n02/textos-pdf.json', {method: 'POST', body: JSON.stringify({width: vp.width, height: vp.height, items})});
document.getElementById('out').textContent = items.length + ' textos guardados. Ahora ejecuta: node scripts/n02-plano/ajuste.mjs';
</script>
