services:
  - type: web
    name: atlas-hpc
    runtime: node
    plan: free
    branch: main
    autoDeploy: false
    buildCommand: node scripts/prepare-offline.mjs && node groq-test.mjs &&node groq-recovery-test.mjs && node offline-test.mjs && node deployment-assets-test.mjs && node source-contours-test.mjs && node contornos-test.mjs &&node layer-colors-test.mjs && node pisos-test.mjs && node doors-test.mjs && node work-charts-test.mjs && node protocol-matrix-test.mjs && node protocol-ejes-test.mjs &&node critical-protocol-test.mjs && node pma-test.mjs && node room-progress-test.mjs && node progress-analysis-test.mjs && node progress-floor-test.mjs && node avance-test.mjs && node avance-pisos-test.mjs && node marking-test.mjs && node protocol-scope-test.mjs && node observaciones-test.mjs && node observaciones-followup-test.mjs && node column-filters-test.mjs && node observaciones-marcas-test.mjs && node rombo-test.mjs && node lastplanner-test.mjs && node lastplanner-ejemplo-test.mjs && node protocolos-recinto-test.mjs && node proyectos-test.mjs && node nube-test.mjs
    startCommand: node server/groq-server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ATLAS_HOST
        value: 0.0.0.0
      - key: ATLAS_ACCESS_USER
        value: atlas
      - key: ATLAS_ACCESS_PASSWORD
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GROQ_MAX_REQUESTS
        value: "60"
      - key: GROQ_MAX_TOKENS
        value: "1024"
