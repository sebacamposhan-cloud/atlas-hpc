services:
  - type: web
    name: atlas-hpc
    runtime: node
    plan: free
    branch: fix/source-room-contours
    autoDeploy: false
    buildCommand: node groq-test.mjs && node offline-test.mjs && node deployment-assets-test.mjs && node source-contours-test.mjs
    startCommand: node server/groq-server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ATLAS_HOST
        value: 0.0.0.0
      - key: ATLAS_ACCESS_USER
        value: atlas
      - key: ATLAS_ACCESS_PASSWORD
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GROQ_MAX_REQUESTS
        value: "60"
      - key: GROQ_MAX_TOKENS
        value: "1024"
